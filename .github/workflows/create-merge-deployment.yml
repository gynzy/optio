        "payload": "${{ steps.resolve-deployment.outputs.RELEASE_PAYLOAD }}"
        "ref": "${{ github.event.pull_request.head.sha }}"
        "token": "${{ secrets.VIRKO_GITHUB_TOKEN }}"
    - "if": "${{ steps.resolve-deployment.outputs.CREATE_DEPLOY_EVENT == 'true' }}"
      "name": "sendSlackMessage"
      "uses": "act10ns/slack@d96404edccc6d6467fc7f8134a420c851b1e9054"
      "with":
        "channel": "#dev-deployments"
        "message": "Deploy to production of ${{ steps.resolve-deployment.outputs.DEPLOY_SUBJECT }} started!\n${{ steps.describe-released-stack-members.outputs.DEPLOY_DETAILS || steps.resolve-deployment.outputs.DEPLOY_DETAILS }}"
        "status": "starting"
        "webhook-url": "${{ secrets.SLACK_WEBHOOK_DEPLOY_NOTIFICATION }}"
    "timeout-minutes": 30
"name": "create-merge-deployment"
"on":
  "pull_request":
    "types":
    - "closed"
